# Installed by deploy/install.sh. Caps all isolate sandboxes together so two
# lanes plus one JVM can never push the 2 GB VM into the host OOM killer.
# Per-box limits come from --cg-mem; this is the backstop.
# 1100M is the base for a 2 GB machine. The judge's pre-start step
# (reset-boxes) sets the cap for this boot from the machine's size with
# systemctl set-property --runtime, which takes precedence over this file.
[Slice]
MemoryMax=1100M
MemorySwapMax=0

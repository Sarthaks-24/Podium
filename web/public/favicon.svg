    .p { fill: none; stroke: #2B3FD6; stroke-width: 4; }
    @media (prefers-color-scheme: dark) { .p { stroke: #8A97FF; } }
  </style>
  <path class="p" d="M9 6v24" />
  <circle class="p" cx="17" cy="15" r="7" />
</svg>

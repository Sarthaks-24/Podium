<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: the on-screen keyboard shrinks the layout, so the sticky workspace strip stays in view (P5 F7.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover" />
    <!-- A college tool behind sign-in: never indexed (v3). -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome colour: matches --paper in src/styles/tokens.css (light and dark). -->
    <meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)" />
    <title>podium</title>
    <!-- Icons: the SVG for browsers that take it, the ICO for the rest, the touch icon for iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Name, colours and icons for a home-screen shortcut; display "browser", so no install prompt (v4 P4). -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Every face the first screen draws (D91): body 400, buttons and links 500, headings 600, the countdown and scores in Fragment Mono. -->
    <link rel="preload" href="/fonts/schibsted-grotesk-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/schibsted-grotesk-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/schibsted-grotesk-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fragment-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Applies the saved theme before first paint; external so the CSP needs no inline hash. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Fallback until the app starts (main.ts clears it). -->
      <main><noscript>Podium needs JavaScript.</noscript></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Runs on every push: gofmt, go vet, Go tests, svelte-check, ESLint, Vitest
# (the `make check` target), plus a Linux release build. The isolate sandbox
# suite needs a host with isolate.service and runs locally or on the VM with
# `make sandbox-test`.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make check
      - run: make build

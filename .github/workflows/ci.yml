# Runs on every push: gofmt, go vet, Go tests, svelte-check, ESLint, Vitest
# (the `make check` target), plus a Linux release build and the size
# budget of a student's first load (web/scripts/size-budget.mjs). The e2e job runs
# the mocked Playwright suite against the Vite dev server, without the
# pixel baselines: their references are Windows renders kept in the
# git-ignored cache/, so they run only on the owner's machine. A third job
# installs isolate on the ubuntu-24.04 runner (cgroup v2) with the VM's own
# install.sh steps and runs the hostile-program suite (`make
# sandbox-test`) and `podium-judge selftest`, the check the VM runs after
# an install or a compiler update (B1.9). If the runner ever cannot host
# isolate, the sandbox job fails at its install step, not silently; the VM
# check stays `sudo -u judge podium-judge selftest`.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make check
      # The race detector needs cgo, which the Ubuntu runner has (gcc).
      - run: cd server && go test -race ./...
      - run: make build
      # A student's first load (entry script, its preloads, the stylesheets)
      # against the gzip budget in web/scripts/size-budget.mjs (v2 P6 F8.3).
      - name: web size budget
        run: cd web && npm run size

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test --grep-invert "pixel baselines"

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The VM's install steps: compilers and runtimes, isolate with its
      # cgroup keeper and tmpfs box root, testlib.h, the judge user.
      - run: sudo deploy/install.sh packages isolate testlib users
      # The tests run as user judge, which cannot read the checkout under
      # /home/runner when that is not world-readable: judge a copy (C2-012).
      - run: cp -r problems /tmp/podium-problems && chmod -R a+rX /tmp/podium-problems
      - run: make sandbox-test SANDBOX_EXAMPLES=/tmp/podium-problems
      - name: podium-judge selftest
        run: |
          cd server && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/podium-judge ./cmd/podium-judge
          sudo install -m 755 bin/podium-judge /usr/local/bin/podium-judge
          cd /tmp && sudo -u judge env PODIUM_ISOLATE_PATH=/usr/bin/isolate PODIUM_JUDGE_CACHE_DIR=/tmp /usr/local/bin/podium-judge selftest

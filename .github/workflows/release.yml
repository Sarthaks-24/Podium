# On a pushed v* tag: the full `make release` (check, build, MANIFEST,
# SHA256SUMS), then a draft GitHub release carrying the tarball, its
# checksum, MANIFEST and SHA256SUMS (B1.8). Only the owner pushes tags
# (D67); the draft is reviewed and published by hand, and install.sh on
# the VM checks SHA256SUMS before installing anything.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # The tag, read through the environment, never pasted into a script.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # git describe in the Makefile needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make release VERSION="$TAG"
      - name: check the release names this tag
        run: |
          test "$(sed -n 's/^version=//p' "release/podium-$TAG/MANIFEST")" = "$TAG"
          cat "release/podium-$TAG/MANIFEST"
          (cd "release/podium-$TAG" && sha256sum --quiet -c SHA256SUMS)
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Built from $TAG by the release workflow. What changed: CHANGELOG.md. Install: docs/OPERATIONS.md, \"Upgrade\". The tarball holds MANIFEST and SHA256SUMS; install.sh checks them." \
            "release/podium-$TAG.tar.gz" "release/podium-$TAG.tar.gz.sha256" \
            "release/podium-$TAG/MANIFEST" "release/podium-$TAG/SHA256SUMS"

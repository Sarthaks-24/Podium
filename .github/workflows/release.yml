# On a pushed v* tag: the full `make release` (check, build, MANIFEST,
# SHA256SUMS), then a draft GitHub release carrying the tarball, its
# checksum, MANIFEST and SHA256SUMS (B1.8). Only the owner pushes tags
# (D67); the draft is reviewed and published by hand, and install.sh on
# the VM checks SHA256SUMS before installing anything.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Read the ci workflow's runs: a tag builds only a commit ci passed.
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The tag, read through the environment, never pasted into a script.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # git describe in the Makefile needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: server/go.mod
          # A release builds from clean caches, never ones a ci run wrote.
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: the ci run of this commit passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml \
            --json status,conclusion -q '[.[] | select(.status == "completed")][0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "ci has not passed on $GITHUB_SHA (latest finished run: ${conclusion:-none}). Push the commit, wait for ci to pass, then push the tag again."
            exit 1
          fi
      - run: make release VERSION="$TAG"
      - name: check the release names this tag
        run: |
          test "$(sed -n 's/^version=//p' "release/podium-$TAG/MANIFEST")" = "$TAG"
          cat "release/podium-$TAG/MANIFEST"
          (cd "release/podium-$TAG" && sha256sum --quiet -c SHA256SUMS)
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Built from $TAG by the release workflow. What changed: CHANGELOG.md. Install: docs/OPERATIONS.md, \"Upgrade\". The tarball holds MANIFEST and SHA256SUMS; install.sh checks them." \
            "release/podium-$TAG.tar.gz" "release/podium-$TAG.tar.gz.sha256" \
            "release/podium-$TAG/MANIFEST" "release/podium-$TAG/SHA256SUMS"
